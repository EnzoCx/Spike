name: Publish website
on:
  push:
    branches: [main]
    paths: ['site/**', 'brand/**', 'tools/Build-Site.ps1', '.github/workflows/pages.yml', 'src/DPSMeter.Desktop/Fonts/**', 'LICENSE', 'THIRD-PARTY-NOTICES.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble public website
        shell: pwsh
        run: ./tools/Build-Site.ps1
      - uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae
        with:
          path: artifacts/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
